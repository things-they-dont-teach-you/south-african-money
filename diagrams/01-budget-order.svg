<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A budget, in order</title>
  <desc id="d">Money comes in: wages, grants, piece work, help from family. If it changes from month to month, plan with the lowest month. It then goes out in order: first essentials such as rent, food, transport, electricity and data; second, debt repayments; third, saving, moved the day money arrives; and last, everything else.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <rect width="720" height="400" rx="12" fill="#fcfcfb"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#0b0b0b">A budget, in order</text>
  <text x="40" y="68" font-size="14" fill="#52514e">Decide what each rand is for before the month starts.</text>

  <rect x="40" y="90" width="640" height="56" rx="8" fill="#2a78d6"/>
  <text x="60" y="114" font-size="15" font-weight="600" fill="#ffffff">Money in: wages, grants, piece work, help from family</text>
  <text x="60" y="134" font-size="13" fill="#ffffff">Income changes? Plan with your lowest month.</text>
  <line x1="360" y1="146" x2="360" y2="170" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="176" width="148" height="128" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
  <text x="114" y="204" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="middle">1</text>
  <text x="114" y="232" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Essentials</text>
  <text x="114" y="254" font-size="12" fill="#52514e" text-anchor="middle">rent, food,</text>
  <text x="114" y="270" font-size="12" fill="#52514e" text-anchor="middle">transport, power,</text>
  <text x="114" y="286" font-size="12" fill="#52514e" text-anchor="middle">data</text>

  <rect x="204" y="176" width="148" height="128" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
  <text x="278" y="204" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="middle">2</text>
  <text x="278" y="232" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Debt repayments</text>
  <text x="278" y="254" font-size="12" fill="#52514e" text-anchor="middle">missing them</text>
  <text x="278" y="270" font-size="12" fill="#52514e" text-anchor="middle">costs more later</text>

  <rect x="368" y="176" width="148" height="128" rx="8" fill="#e7f6ee" stroke="#0ca30c" stroke-width="2"/>
  <text x="442" y="204" font-size="26" font-weight="700" fill="#0ca30c" text-anchor="middle">3</text>
  <text x="442" y="232" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Saving</text>
  <text x="442" y="254" font-size="12" fill="#52514e" text-anchor="middle">move it the day</text>
  <text x="442" y="270" font-size="12" fill="#52514e" text-anchor="middle">money arrives</text>

  <rect x="532" y="176" width="148" height="128" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
  <text x="606" y="204" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="middle">4</text>
  <text x="606" y="232" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Everything else</text>
  <text x="606" y="254" font-size="12" fill="#52514e" text-anchor="middle">takeaways, clothes,</text>
  <text x="606" y="270" font-size="12" fill="#52514e" text-anchor="middle">going out</text>

  <line x1="188" y1="240" x2="202" y2="240" stroke="#52514e" stroke-width="2"/>
  <line x1="352" y1="240" x2="366" y2="240" stroke="#52514e" stroke-width="2"/>
  <line x1="516" y1="240" x2="530" y2="240" stroke="#52514e" stroke-width="2"/>

  <rect x="40" y="324" width="640" height="44" rx="8" fill="#fdf1e9" stroke="#eb6834" stroke-width="2"/>
  <text x="60" y="351" font-size="14" fill="#0b0b0b">A good month? Put the extra in a "smoothing" pot for the next bad month.</text>
  <text x="40" y="390" font-size="12" fill="#52514e">An example order, not financial advice.</text>
</svg>
